services:

  db:
    image: postgres:16-alpine
    container_name: agrotrace-db
    environment:
      POSTGRES_DB: agrotrace
      POSTGRES_USER: agrotrace
      POSTGRES_PASSWORD: agrotrace2026
    ports:
      - "5432:5432"
    volumes:
      - agrotrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrotrace -d agrotrace"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: agrotrace-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  agrotrace_pgdata:
