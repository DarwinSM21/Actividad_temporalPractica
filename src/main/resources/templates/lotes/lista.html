<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>AgroTrace Quevedo — Lotes de cacao</title>
	<link rel="stylesheet" th:href="@{/css/estilo.css}"/>
</head>
<body>

<header class="cabecera">
	<h1>AgroTrace Quevedo</h1>
	<p class="sub">APROCAFA — Centro de acopio km 7 vía Quevedo–El Empalme</p>
</header>

<main class="contenedor">

	<div th:if="${mensaje}" class="aviso ok" th:text="${mensaje}"></div>

	<section class="barra">
		<form method="get" th:action="@{/lotes}" class="filtro">
			<label for="estado">Filtrar por estado</label>
			<select id="estado" name="estado" onchange="this.form.submit()">
				<option value="">Todos</option>
				<option th:each="e : ${estados}"
				        th:value="${e}"
				        th:text="${e}"
				        th:selected="${e == estadoSeleccionado}">ESTADO</option>
			</select>
		</form>
		<a class="boton" th:href="@{/lotes/nuevo}">Registrar lote</a>
	</section>

	<p id="aviso" class="aviso" aria-live="polite"></p>

	<table id="tabla-lotes" class="tabla">
		<thead>
		<tr>
			<th>Código</th>
			<th>Finca</th>
			<th>Recepción</th>
			<th class="num">Peso</th>
			<th class="num">Humedad</th>
			<th>Estado</th>
		</tr>
		</thead>

		<tbody>
		<tr th:each="lote : ${lotes}">
			<td th:text="${lote.codigo}">LT-000</td>
			<td th:text="${lote.finca.nombre}">Finca</td>
			<td th:text="${#temporals.format(lote.fechaRecepcion, 'dd/MM/yyyy')}">01/01/2026</td>
			<td class="num" th:text="${lote.pesoKg} + ' kg'">0 kg</td>
			<td class="num" th:text="${lote.humedadPorcentaje} + ' %'">0 %</td>
			<td>
				<span class="badge"
				      th:classappend="${lote.estado.name() == 'ACEPTADO'} ? 'ok'
				          : (${lote.estado.name() == 'RECHAZADO'} ? 'no' : 'espera')"
				      th:text="${lote.estado}">ESTADO</span>
			</td>
		</tr>
		<tr th:if="${#lists.isEmpty(lotes)}">
			<td colspan="6" class="vacio">No hay lotes con ese criterio.</td>
		</tr>
		</tbody>
	</table>

	<section class="tablero">
		<h2>Clima para el secado</h2>
		<p id="aviso-clima" class="aviso">Cargando pronóstico…</p>
		<div id="clima"></div>
	</section>

</main>

<script th:src="@{/js/tablero.js}"></script>
</body>
</html>
