<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>AgroTrace Quevedo — Lotes de cacao</title>
	<link rel="stylesheet" th:href="@{/css/estilo.css}"/>
</head>
<body>

<header class="cabecera">
	<h1>AgroTrace Quevedo</h1>
	<p class="sub">APROCAFA — Centro de acopio km 7 vía Quevedo–El Empalme</p>
</header>

<main class="contenedor">

	<div th:if="${mensaje}" class="aviso ok" th:text="${mensaje}"></div>

	<section class="barra">
		<form method="get" th:action="@{/lotes}" class="filtro">
			<label for="estado">Filtrar por estado</label>
			<select id="estado" name="estado" onchange="this.form.submit()">
				<option value="">Todos</option>
				<option th:each="e : ${estados}"
				        th:value="${e}"
				        th:text="${e}"
				        th:selected="${e == estadoSeleccionado}">ESTADO</option>
			</select>
		</form>
		<a class="boton" th:href="@{/lotes/nuevo}">Registrar lote</a>
	</section>

	<table id="tabla-lotes" class="tabla">
		<thead>
		<tr>
			<th>Código</th>
			<th>Finca</th>
			<th>Recepción</th>
			<th class="num">Peso</th>
			<th class="num">Humedad</th>
			<th>Estado</th>
		</tr>
		</thead>

		<!--
			TODO-GA-04: iterar los lotes y colorear el estado.

			Complete el <tbody> siguiendo estas indicaciones:

			  1. <tr th:each="lote : ${lotes}"> para recorrer la lista.
			  2. Una celda por columna con th:text.
			     La fecha se formatea con:
			       ${#temporals.format(lote.fechaRecepcion, 'dd/MM/yyyy')}
			  3. La celda de estado lleva un <span class="badge"> cuya clase
			     adicional depende del estado, con th:classappend:
			       'ok'     si el estado es ACEPTADO
			       'no'     si el estado es RECHAZADO
			       'espera' en cualquier otro caso
			  4. Anada una fila de lista vacia con:
			       <tr th:if="${#lists.isEmpty(lotes)}">
		-->
		<tbody>
		<tr>
			<td colspan="6" class="vacio">
				TODO-GA-04: complete el cuerpo de esta tabla.
			</td>
		</tr>
		</tbody>
	</table>

	<section class="tablero">
		<h2>Clima para el secado</h2>
		<p id="aviso-clima" class="aviso">Cargando pronóstico…</p>
		<div id="clima"></div>
	</section>

</main>

<script th:src="@{/js/tablero.js}"></script>
</body>
</html>
